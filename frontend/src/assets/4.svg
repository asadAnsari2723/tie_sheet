<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 120 80">
  <title>4-Player Tournament Bracket</title>
  <style>
.bracket-line {
stroke: black;
stroke-width: 1.5;
}
.bracket-shape {
fill: none;
stroke: black;
stroke-width: 1.5;
}
.bracket-dot {
fill: black;
}
</style>
  <g id="match1">
    <path class="bracket-shape" d="M 10 20 L 30 20 L 30 5 L 10 5"/>
    <line class="bracket-line" x1="30" y1="12.5" x2="40" y2="12.5"/>
    <circle class="bracket-dot" cx="30" cy="12.5" r="1.5"/>
  </g>
  <g id="match2">
    <path class="bracket-shape" d="M 10 60 L 30 60 L 30 45 L 10 45"/>
    <line class="bracket-line" x1="30" y1="52.5" x2="40" y2="52.5"/>
    <circle class="bracket-dot" cx="30" cy="52.5" r="1.5"/>
  </g>
  <g id="connector" style="" transform="matrix(0.756024, 0, 0, 1, 9.393064, 0)">
    <line class="bracket-line" x1="40" y1="12.5" x2="40" y2="52.5"/>
    <line class="bracket-line" x1="40" y1="32.5" x2="70" y2="32.5"/>
    <circle class="bracket-dot" cx="40" cy="32.5" r="1.5"/>
  </g>
</svg>